# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "retail-recon-databricks"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-34677092-f2b4.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-34677092-f2b4.cloud.databricks.com
      # We always use /Users/jagadeeswaran.vp@sstcloud.com.au for all resources to make sure we only have a single copy.
      root_path: /Users/jagadeeswaran.vp@sstcloud.com.au/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as jagadeeswaran.vp@sstcloud.com.au in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: jagadeeswaran.vp@sstcloud.com.au
